<div class="add-post-page">
    <div class="content-grid">

        <div class="card photos-card">
            <h3 class="card-title">ფოტოები</h3>
            <div class="photo-grid">
                <div *ngFor="let p of uploadPhotos; let i = index" class="photo-tile" data-aos="fade-in">
                    <button class="remove-photo" *ngIf="p.preview" (click)="removePhoto(p.id)">
                        <i class="fas fa-times"></i>
                    </button>
                    <div class="photo-container" *ngIf="p">
                        <img *ngIf="p.preview" [src]="p.preview" class="photo">
                    </div>
                </div>
                <div class="add-photo-tile" (click)="triggerFileInput()">
                    <i class="fas fa-plus"></i>
                    <span>ფოტოს დამატება</span>
                </div>
                <input id="photoinput" type="file" (change)="onFileChange($event)" accept="image/*" hidden>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">დეტალები</h3>
            <div class="fields-grid">
                <div class="form-control-group span-2">
                    <label class="form-control-label">დასახელება</label>
                    <input type="text" class="form-control" [(ngModel)]="title">
                </div>
                <div class="form-control-group span-2">
                    <label class="form-control-label">კატეგორია</label>
                    <select class="form-control select-control" [(ngModel)]="productTypeId">
                        <option value="0"></option>
                        <option *ngFor="let i of productTypesList" [value]="i.id">{{i.productType}}</option>
                    </select>
                </div>
                <div class="form-control-group">
                    <label class="form-control-label">ფასი</label>
                    <input type="number" class="form-control" placeholder="₾" (input)="discountAmountChangeDetection()" [(ngModel)]="price">
                </div>
                <div class="form-control-group">
                    <label class="form-control-label">
                        ფასდაკლებული ფასი
                        <span class="discount-chip" *ngIf="discountedPrice" [ngClass]="{'positive':discountedPercentage>0,'negative':discountedPercentage<0}">
                            <ng-container *ngIf="discountedPercentage>0">-</ng-container>{{discountedPercentage}}%
                        </span>
                    </label>
                    <input type="number" class="form-control" placeholder="₾" (input)="discountAmountChangeDetection()" [(ngModel)]="discountedPrice">
                </div>
                <div class="form-control-group span-2">
                    <label class="form-control-label">აღწერა</label>
                    <textarea class="form-control description" [(ngModel)]="description" maxlength="500"></textarea>
                </div>
            </div>
        </div>

        <app-additional-params [(assignedParamIds)]="selectedParamIds"></app-additional-params>

        <div class="card">
            <h3 class="card-title">მარაგი</h3>
            <div class="inventory-row">
                <input type="number" class="form-control quantity-input" placeholder="რაოდენობა" [(ngModel)]="quantity">
            </div>
            <div class="order-allowed-row">
                <span class="order-allowed-label">შეკვეთა მარაგის ამოწურვის შემდეგ</span>
                <button class="toggle-pill" [ngClass]="{'is-off':orderNotAllowed}" (click)="ToggleorderNotAllowed(!orderNotAllowed)">
                    {{ orderNotAllowed ? 'შეზღუდული' : 'დაშვებული' }}
                </button>
            </div>
        </div>

        <button class="primary-btn full-width" (click)="sendApplicationtoBackends()">
            პროდუქტის დამატება
        </button>
    </div>
</div>
