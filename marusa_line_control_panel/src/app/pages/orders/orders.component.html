<div class="search-modal-overlay" *ngIf="modalVisible">
    <div class="search-modal-back" (click)="closeModal()"></div>
  <div class="search-modal">
    <div class="search-modal__header">
      <div class="search-modal__icon">🔍</div>
      <h3 class="search-modal__title">შეკვეთის ძებნა</h3>
      <button class="search-modal__close" (click)="closeModal()">✕</button>
    </div>
    <div class="search-modal__body">
      <label class="search-modal__label">შეკვეთის ნომერი</label>
      <div class="search-modal__input-row">
        <span class="search-modal__prefix">#</span>
        <input
          class="search-modal__input"
          type="number"
          [(ngModel)]="orderSearchNum"
          placeholder="მაგ: 1042"
        />
      </div>
    </div>

    <!-- Footer -->
    <div class="search-modal__footer">
      <button class="search-modal__btn search-modal__btn--cancel" (click)="closeModal()">გაუქმება</button>
      <button class="search-modal__btn search-modal__btn--search" (click)="OrderSearch()">
        ძებნა <i class="fas fa-search"></i>
      </button>
    </div>

  </div>
</div>

<div class="center-container">
    <div class="container">
        <div class="order-filter-align">
            <div class="filters">
                <div class="filter pay-filter " [ngClass]="{'not-paid':selectedFilter ==0}" (click)="getPaidOrUnpaidOrders(false)">
                    გადასახდელი
                </div>
                <div class="filter pay-filter " [ngClass]="{'paid-filter':selectedFilter ==1}" (click)="getPaidOrUnpaidOrders(true)">
                    გადახდილი
                </div>
                <button class="filter" style="padding: 20px 20px; border-radius: 10px;     background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border:none; cursor: pointer;" (click)="openmodal()"> <i class="fas fa-search"></i></button>
            </div>
        </div>

        <div class="orders-grouped" *ngIf="groupedOrders.length>0">
            <ng-container *ngFor="let i of groupedOrders">
            <!-- <div class="month-header">
               <p>სულ</p>
               <p style="font-size: 18px;"><i class="fas fa-shopping-cart"></i> {{dashboardStats.unpaidOrdersCount}}</p>
               <p style="font-size: 18px;">{{dashboardStats.totalUnPaidAmount}}₾</p>
           </div>  -->
           <div class="month-header">
               {{ i.monthLabel }}
              <!-- <div class="month-stat">
                  <p style="font-size: 16px;"><i class="fas fa-shopping-cart"></i> {{i.orders.length}}</p>
                  <p style="font-size: 16px;">{{orderPrices(i.orders)}}₾</p>
              </div> -->
           </div> 
            <div class="order-card-align" >
                <div class="order-card-wrapper" *ngFor="let o of i.orders">
                <span class="last-comment-badge" *ngIf="o.lastOwnerComment" [title]="o.lastOwnerComment">{{ o.lastOwnerComment }}</span>
                <div class="order-card" [ngClass]="{'just-now-card':getTimeAgo(o.createDate)==='just now'}" [routerLink]="AppRoutes.orderDetails + o.orderId">
                    <div class="pay-align">
                        <span class="pay-span" [ngClass]="{'finished-order': o.statusId ==5,'payed-span': o.isPaid,'old-seven-day': isOlderThan7Day(o.createDate) && !o.isPaid,}"> #{{o.orderNumber}}</span>
                        <div class="user-details">
                            <div class="user-container">
                                <img [src]="o.user.profilePhoto" class="user-img" alt="">
                            </div>
                        </div>
                    </div>
                    <div class="order-details">
                        <div class="order order-details-back"  *ngIf="o.isPaid&&o.statusId !=5">
                            <p style="display: flex; justify-content: space-between;" >{{o.createDate| date:'dd MMM'}}  <b style="font-size: 14px;">{{o.finalPrice}}₾</b> </p>
                        </div>
                        <div class="order order-details-back"[ngClass]="{'old-one-day': isOlderThan1Day(o.createDate) && !o.isPaid,'old-seven-day': isOlderThan7Day(o.createDate) && !o.isPaid}" *ngIf="!o.isPaid">
                            <p style="display: flex; justify-content: space-between;" [ngClass]="{'just-now':getTimeAgo(o.createDate)==='just now'}">{{getTimeAgo(o.createDate)}} <b style="font-size: 14px;">{{o.finalPrice}}₾</b> </p>
                        </div>
                        <div class="order order-details-back" *ngIf="o.isPaid" [ngClass]="{'finished-order': o.statusId ==5}">
                            <p>{{getStatusName(o.statusId)}} </p>
                        </div>
                        <div class="order" style="padding: 0; border: none;">
                            <p class="order-count" s> <i class="fas fa-close"></i> {{o.productQuantity}}</p>               
                            <div class="order-photo-container">
                                <img  *ngIf="o.photos[0]?.photoUrl" [src]="o.photos[0].photoUrl" class="order-photo" alt="">
                                <div *ngIf="!o.photos[0]?.photoUrl" class="order-photo" alt=""></div>
                                <div class="order-title-absolute" ><p class="orders-title" >{{o.title}}</p></div>
                            </div>
                        </div>
                    </div>
                </div>
                </div>
            </div>
            </ng-container>
        </div>
    </div>
</div>
<div style="width: 100%;padding: 200px; display: flex; justify-content: center; align-items: center;" *ngIf="groupedOrders.length<=0">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 50px;">
        <i class="fas fa-shopping-cart" style="color: white; scale: 5;"></i>
        <b style="color: white; text-wrap: nowrap;">No orders Yet!</b>
    </div>
</div>

<div class="center-pagenation" *ngIf="groupedOrders.length>0">
     <div class="pageination-align">
    <div class="buttons-align">
       <button class="next-button" type="button" (click)="changePage(selectedPage - 1)">
         <span class="btn-inner--icon">
           ◀
         </span>
       </button>
       <div class="page-numbers-align">
         <ng-container *ngFor="let p of [0,1,2,3,4]">
           <button *ngIf="(pageNumber + p) <= totalPages" class="pageination-buttons"
             [class.selected]="selectedPage === (pageNumber + p)" (click)="changePage(pageNumber + p)">
             {{ pageNumber + p }}
           </button>
         </ng-container>
       </div>
       <button class="next-button" type="button" (click)="changePage(selectedPage + 1)">
         <span class="btn-inner--icon">
          ▶
         </span>
       </button>
    </div>
</div>
</div>
