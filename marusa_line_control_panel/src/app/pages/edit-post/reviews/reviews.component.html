<div class="reviews-page">
  <div class="reviews-container">
    <div *ngIf="reviews.length>0">
      <p style="font-size: 20px;">შეფასებები <b >{{reviews.length}}</b> </p>
    </div> 
    <!-- Write Review Section -->

    <div class="divider"  *ngIf="reviews.length > 0 && currentUser"  ></div>
    <div class="reviews-list"  *ngIf="reviews.length > 0">
      <div class="review-card" *ngFor="let r of reviews">
        <button class="delete" (click)="deleteReview(r.id)"> <i class="fas fa-close"></i> წაშლა</button>
        <div class="review-header">
          <div class="avatar" style="display: flex; justify-content: center; align-items: center; border-radius: 50%; overflow: hidden;">
            <img style="width: 100%; height: 100%; object-fit: cover;" [src]="r.avatar" alt="">
          </div>
          <div class="review-meta">
            <span class="reviewer-name">{{ r.name }}</span>
            <div class="review-stars">
              <span
                *ngFor="let filled of getStars(r.rating)"
                class="star-display"
                [class.filled]="filled"
              >★</span>
            </div>
          </div>
        </div>
        <p class="review-comment" style="color: white;" *ngIf="r.comment">{{ r.comment }}</p>
      </div>
    </div>
    <!-- <p class="no-reviews" *ngIf="reviews.length === 0">შეფასებები არ არის</p> -->
  </div>
</div>
