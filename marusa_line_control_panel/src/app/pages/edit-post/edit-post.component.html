<div class="edit-post-page">

    <div class="page-toolbar" [ngClass]="posts.dateDeleted ? 'is-hidden' : 'is-visible'">
        <div class="visibility-block">
            <button class="toolbar-btn visibility-btn" *ngIf="posts.dateDeleted==null" (click)="removePost()">
                <i class="fas fa-eye-slash"></i> საიტიდან დამალვა
            </button>
            <button class="toolbar-btn visibility-btn" *ngIf="posts.dateDeleted" (click)="revertPost()">
                <i class="fas fa-eye"></i> საიტზე ჩვენება
            </button>
        </div>

        <div class="copy-link-block">
            <button class="toolbar-btn" (click)="copyToClipboard(AppUrl.ShopsBaseUrl+'card-details/'+postId,1)">
                <i class="fas" [ngClass]="copiedNumber==1 ? 'fa-check' : 'fa-link'"></i>
                {{ copiedNumber==1 ? 'დაკოპირდა' : 'ბმულის კოპირება' }}
            </button>
        </div>
    </div>

    <div class="content-grid">

        <div class="card photos-card">
            <h3 class="card-title">ფოტოები</h3>
            <div class="photo-grid">
                <div *ngFor="let p of uploadPhotos; let i = index" class="photo-tile" data-aos="fade-in">
                    <button class="remove-photo" (click)="removePhoto(p.id)">
                        <i class="fas fa-times"></i>
                    </button>
                    <div class="photo-container">
                        <img [src]="p.preview" class="photo">
                    </div>
                </div>
                <div class="add-photo-tile" *ngIf="uploadPhotos.length<6" (click)="triggerFileInput()">
                    <i class="fas fa-plus"></i>
                    <span>ფოტოს დამატება</span>
                </div>
                <input id="photoinput" type="file" (change)="onFileChange($event)" accept="image/*" hidden>
            </div>
            <button class="primary-btn full-width" *ngIf="changeNum!=0" (click)="SavePhotos()">
                ფოტოების შენახვა
            </button>
        </div>

        <div class="right-column">

            <div class="card">
                <div class="edit-actions">
                    <button class="edit-toggle-btn" *ngIf="!editProductVisible" (click)="editProduct()">
                        <i class="fas fa-pen"></i> რედაქტირება
                    </button>
                    <ng-container *ngIf="editProductVisible">
                        <button class="primary-btn" (click)="ValidateAndSaveEditedProduct()">შენახვა</button>
                        <button class="ghost-btn" (click)="rollbackProduct()">გაუქმება</button>
                    </ng-container>
                </div>

                <div class="fields-grid" [class.is-editing]="editProductVisible">
                    <div class="form-control-group span-2">
                        <label class="form-control-label">დასახელება</label>
                        <input [disabled]="!editProductVisible" type="text" class="form-control" maxlength="50" [(ngModel)]="title">
                    </div>
                    <div class="form-control-group span-2">
                        <label class="form-control-label">კატეგორია</label>
                        <select class="form-control select-control" [disabled]="!editProductVisible" [(ngModel)]="productTypeId">
                            <option value="0" disabled></option>
                            <option *ngFor="let i of productTypesList" [value]="i.id">{{i.productType}}</option>
                        </select>
                    </div>
                    <div class="form-control-group">
                        <label class="form-control-label">ფასი</label>
                        <input [disabled]="!editProductVisible" type="number" class="form-control" placeholder="₾" (input)="discountAmountChangeDetection()" [(ngModel)]="price">
                    </div>
                    <div class="form-control-group">
                        <label class="form-control-label">
                            ფასდაკლებული ფასი
                            <span class="discount-chip" *ngIf="discountedPrice" [ngClass]="{'positive':discountedPercentage>0,'negative':discountedPercentage<0}">
                                <ng-container *ngIf="discountedPercentage>0">-</ng-container>{{discountedPercentage}}%
                            </span>
                        </label>
                        <input [disabled]="!editProductVisible" type="number" class="form-control" placeholder="₾" (input)="discountAmountChangeDetection()" [(ngModel)]="discountedPrice">
                    </div>
                    <div class="form-control-group span-2">
                        <label class="form-control-label">აღწერა</label>
                        <textarea [disabled]="!editProductVisible" class="form-control description" [(ngModel)]="description" maxlength="500"></textarea>
                    </div>
                </div>
            </div>

            <app-additional-params [productId]="postId"></app-additional-params>

            <div class="card">
                <h3 class="card-title">მარაგი</h3>

                <div class="inventory-row">
                    <input [disabled]="!editQuantityVisible" type="number" class="form-control quantity-input" [(ngModel)]="quantity">
                    <div class="quantity-actions">
                        <button *ngIf="!editQuantityVisible" class="icon-btn" (click)="editQuantity()"><i class="fas fa-pen"></i></button>
                        <button *ngIf="editQuantityVisible" class="icon-btn confirm" (click)="saveQuantity()"><i class="fas fa-check"></i></button>
                        <button *ngIf="editQuantityVisible" class="icon-btn cancel" (click)="closeQuantityEdit()"><i class="fas fa-times"></i></button>
                    </div>
                </div>

                <div class="order-allowed-row">
                    <span class="order-allowed-label">შეკვეთა მარაგის ამოწურვის შემდეგ</span>
                    <button class="toggle-pill" [ngClass]="{'is-off':posts.orderNotAllowed}" (click)="orderAllowedToggle()">
                        {{ posts.orderNotAllowed ? 'შეზღუდული' : 'დაშვებული' }}
                    </button>
                </div>
            </div>

        </div>
    </div>

    <button class="danger-btn-large" *ngIf="posts.dateDeleted" (click)="deleteProductPermanently()">
        <i class="fas fa-trash"></i> პროდუქტის წაშლა
    </button>
</div>
<div class="reviews">
    <app-reviews></app-reviews>
</div>
