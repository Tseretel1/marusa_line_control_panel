<div class="photo-container" [ngClass]="{'deleted': posts.dateDeleted!=null}" [routerLink]="AppRoutes.editPosts+posts.id">
    <div class="photo-half">
        <img *ngIf="posts.photoUrl==null"  [src]="posts.photos[0]?.photoUrl" alt="" class="photo">
        <img *ngIf="posts.photoUrl" [src]="posts.photoUrl" alt="" class="photo">
    </div>

    <div class="info-half">
        <p class="card-title">{{posts.title}}</p>
    </div>

    <div class="badge-row">
        <div class="quantity-align" *ngIf="posts.dateDeleted==null" [ngClass]="{'low-quantity-back':posts.quantity<=0}">
            <b>მარაგში <span class="quantit" [ngClass]="{'low-quantity':posts.quantity<=0}">{{posts.quantity}}</span></b>
        </div>
        <div class="quantity-align" *ngIf="posts.dateDeleted!=null">
            <b>მარაგში: {{posts.quantity}}</b>
        </div>

        <div class="discount-price-mobile">
            <b [ngClass]="{'discounted-price': posts.discountedPrice>0}">{{posts.price}}₾</b>
            <b *ngIf="posts.discountedPrice>0">{{posts.discountedPrice}}₾</b>
        </div>
    </div>
</div>
